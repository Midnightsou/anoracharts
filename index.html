<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <title>Anoracharts — Independent Music Charts</title>
  <meta name="description" content="Independent music chart tracking, weekly rankings, artists, albums, records and awards." />
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#home" aria-label="Anoracharts home">
        <span class="brand-mark">A</span>
        <span class="brand-name">ANORACHARTS</span>
      </a>
      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#home">Home</a>
        <a href="#hot100">Hot 100</a>
        <a href="#artists">Artists</a>
        <a href="#albums">Albums</a>
        <a href="#records">Records</a>
        <a href="#awards">Awards</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
        <button class="menu-btn" id="menuBtn" aria-label="Toggle menu"><span></span><span></span></button>
      </div>
    </header>

    <div class="mobile-menu" id="mobileMenu">
      <a href="#home">Home</a><a href="#hot100">Hot 100</a><a href="#artists">Artists</a>
      <a href="#albums">Albums</a><a href="#records">Records</a><a href="#awards">Awards</a>
    </div>

    <main id="app"></main>

    <footer class="site-footer">
      <div>
        <div class="footer-brand">ANORACHARTS</div>
        <p>Independent music chart tracking and statistics.</p>
      </div>
      <div class="footer-links">
        <a href="#hot100">Charts</a><a href="#artists">Artists</a><a href="#albums">Albums</a>
        <a href="#records">Records</a><a href="#awards">Awards</a><a href="#archive">Archive</a>
      </div>
      <div class="footer-meta">© <span id="year"></span> Anoracharts · Built for the culture.</div>
    </footer>
  </div>

  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <div class="search-panel">
      <div class="search-topline">
        <strong>Search Anoracharts</strong>
        <button class="icon-btn" id="closeSearch">✕</button>
      </div>
      <input id="globalSearch" class="search-input" type="search" placeholder="Search songs, artists or albums..." autocomplete="off" />
      <div id="searchResults" class="search-results"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
